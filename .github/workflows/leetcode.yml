name: Update LeetCode card

on:
  schedule:
    - cron: "41 1 * * *"     # daily, ~07:11 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/leetcode/**"
      - ".github/workflows/leetcode.yml"

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render card from LeetCode stats
        run: python3 tools/leetcode/leetcode_card.py RahulM1305 assets/leetcode.svg

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/leetcode.svg
          if git commit -m "Update LeetCode card"; then
            git pull --rebase
            git push
          fi
