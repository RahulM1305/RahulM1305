name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "17 0 * * *"     # daily, ~05:47 IST (GitHub may start it a few hours late)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push (retry on races, never conflicts)
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          cp -r profile-3d-contrib "$RUNNER_TEMP/p3d"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf profile-3d-contrib && cp -r "$RUNNER_TEMP/p3d" profile-3d-contrib
            git add -A profile-3d-contrib
            if git diff --cached --quiet; then
              echo "Calendar already up to date."
              exit 0
            fi
            git commit -m "Update 3D contribution calendar"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt)…"
            sleep $((attempt * 5))
          done
          exit 1
